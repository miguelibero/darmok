syntax = "proto3";

package darmok.protobuf;

import "math.proto";
import "texture.proto";

message UniformValue {
    oneof value {
        Vec4 vec4 = 1;
        Mat4 mat4 = 2;
        Mat3 mat3 = 3;
    }
}

message MaterialTexture {
    enum Type {
        BaseColor = 0;
        MetallicRoughness = 1;
        Normal = 2;
        Occlusion = 3;
        Emissive = 4;
        Specular = 5;

        EnvironmentIrradiance = 6;
        EnvironmentPrefiltered = 7;
    }

    oneof key {
        Type type = 1;
        TextureUniformKey uniform = 2;
    }
    string texture_path = 3;
}

message Material {
    string name = 1;

    enum ShadingModel {
        Lit = 0;
        Unlit = 1;
    }

    ShadingModel shading_model = 2;
    
    repeated MaterialTexture textures = 3;
    map<string, UniformValue> uniform_values = 4;

    enum DepthTest {
        DepthNoTest = 0;
        DepthLess = 1;
        DepthLessEqual = 2;
        DepthEqual = 3;
        DepthGreaterEqual = 4;
        DepthGreater = 5;
        DepthNotEqual = 6;
        DepthNever = 7;
        DepthAlways = 8;
    }
    
    DepthTest depth_test = 5;

    enum OpacityType {
        Opaque = 0;
        Mask = 1;
        Transparent = 2;
    }

    OpacityType opacity_type = 6;

    enum PrimitiveType {
        Triangle = 0;
        Line = 1;
    }

    PrimitiveType primitive_type = 7;
    bool twoSided = 8;

    Color base_color = 9;
    Color3 emissive_color = 10;
    float metallic_factor = 11;
    float roughness_factor = 12;
    float normal_scale = 13;
    float occlusion_strength = 14;
    bool multiple_scattering = 15;
    float white_furnance_factor = 16;

    Color3 specular_color = 17;
    uint32 shininess = 18;

    // pixels with alpha below this value are discarded when opacity_type is Mask
    float alpha_cutoff = 19;
}